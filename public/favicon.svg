<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background subtle glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </radialGradient>
    
    <!-- Top isometric face (Gold metallic tech) -->
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Left isometric face (Deep Navy) -->
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Right isometric face (Tech Slate with Amber tint) -->
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0B1120"/>
    </linearGradient>

    <!-- Screen / Chip Glow -->
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Container Box / App Icon Shape -->
  <rect width="64" height="64" rx="16" fill="url(#bgGlow)"/>
  <rect width="64" height="64" rx="16" stroke="rgba(245, 158, 11, 0.25)" stroke-width="1.5"/>

  <!-- 3D Isometric Tech Cube (Gudang Hub) -->
  <g transform="translate(32, 33)">
    <!-- Bottom Shadow -->
    <path d="M0 19 L19 8 L0 -3 L-19 8 Z" fill="rgba(0,0,0,0.5)" filter="blur(2px)"/>

    <!-- Left Face -->
    <path d="M-19 5 L0 16 L0 0 L-19 -11 Z" fill="url(#leftFace)"/>

    <!-- Right Face -->
    <path d="M0 16 L19 5 L19 -11 L0 0 Z" fill="url(#rightFace)"/>

    <!-- Top Face (Glow Amber/Gold) -->
    <path d="M0 -22 L19 -11 L0 0 L-19 -11 Z" fill="url(#topFace)"/>

    <!-- Isometric Smart Device / Screen floating on top face -->
    <path d="M0 -17 L12 -10 L0 -3 L-12 -10 Z" fill="#0F172A"/>
    <path d="M0 -15 L9 -10 L0 -5 L-9 -10 Z" fill="url(#screenGlow)" opacity="0.9"/>
    
    <!-- Tech Circuit & Sensor Dots -->
    <circle cx="0" cy="-10" r="1.5" fill="#FFFFFF"/>
    <circle cx="-5" cy="-10" r="0.8" fill="#FDE68A"/>
    <circle cx="5" cy="-10" r="0.8" fill="#FDE68A"/>

    <!-- Front Bevel Lines -->
    <path d="M-19 -11 L0 0 L19 -11" stroke="rgba(255,255,255,0.3)" stroke-width="0.75" stroke-linecap="round"/>
    <path d="M0 0 L0 16" stroke="rgba(245, 158, 11, 0.5)" stroke-width="0.75" stroke-linecap="round"/>
  </g>
</svg>